# Config Agent Gate: test. Secret hanya dari env var (tanpa default di staging/production).

logger:
  enable: false
  pretty_backtrace: true
  level: <%= get_env(name="LOG_LEVEL", default="debug") %>
  format: compact

server:
  # PORT di-set wrapper bin/* (dev/test) atau orkestrator (staging/production); tanpa default.
  port: <%= get_env(name="PORT") %>
  binding: <%= get_env(name="BINDING", default="localhost") %>
  host: http://localhost:<%= get_env(name="PORT") %>
  middlewares:
    static:
      enable: true
      # Loco melayani `fallback` dengan status 200 untuk file statis yang tidak ada, sehingga
      # aset rusak tidak terlihat. Fallback sengaja menunjuk file yang tidak ada: ServeFile
      # membalas 404 dan layer html_errors merender halaman 404.
      must_exist: false
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/.missing"
    # Fallback bawaan Loco (halaman Inggris) dimatikan: 404 dirender aplikasi lewat fallback
    # router di App::before_routes dan layer html_errors.
    fallback:
      enable: false
    request_id:
      enable: true
    remote_ip:
      enable: true
      # Dev/test diakses langsung, tanpa proxy.
      source: ConnectInfo
    secure_headers:
      enable: true
      preset: github
      overrides:
        # form-action memuat domain authorize Google dan GitHub: tombol login OAuth adalah form
        # POST ke /auth/{provider} yang dijawab 303 ke provider, dan Chrome menerapkan
        # form-action juga pada redirect setelah submit form.
        Content-Security-Policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com https://github.com; frame-ancestors 'none'"
        # M12: URL aplikasi (kode tiket, token di query) tidak bocor lewat Referer ke origin lain;
        # fitur perangkat yang tidak dipakai dimatikan untuk semua frame.
        Referrer-Policy: "same-origin"
        Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        # HSTS hanya di staging/production (development memakai http).
        Strict-Transport-Security: "max-age=0"

workers:
  mode: ForegroundBlocking

queue:
  kind: Postgres
  # Database TEST, bukan DATABASE_URL: perintah tes yang lupa wrapper bin/test (mis.
  # `bin/sh cargo test`) tidak boleh menyentuh database dev. Tanpa default.
  uri: <%= get_env(name="TEST_DATABASE_URL") %>
  dangerously_flush: false

mailer:
  stub: true
  smtp:
    enable: true
    # Nama host sengaja tidak resolve: tes yang menyentuh jaringan langsung gagal.
    host: smtp.agentgate.test
    port: 1025
    secure: false

database:
  # TEST_DATABASE_URL tanpa default (lihat queue di atas).
  uri: <%= get_env(name="TEST_DATABASE_URL") %>
  enable_logging: false
  # Juga batas tunggu koneksi dari pool: 500ms membuat burst 12 login paralel (tes throttle)
  # sesekali gagal 500 karena pool 10 koneksi habis sementara hash argon berjalan.
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="10") %>
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: false

auth:
  # Sesi server-side Loco (rules §7): cookie hanya membawa id acak bertanda tangan, datanya di
  # tabel loco_sessions, sehingga logout/ganti password/nonaktifkan user mengakhiri sesi seketika.
  # Tanpa `jwt` (tidak bisa dicabut) dan tanpa `remember_for` (remember-me mati).
  session:
    store: database
    # Kunci tanda tangan cookie sesi. Default di bawah KHUSUS test, bukan rahasia; staging dan
    # production membacanya dari env tanpa default. Mengganti nilainya me-logout semua user.
    secret: <%= get_env(name="SESSION_SECRET", default="agentgate-test-only-session-secret-not-a-secret-0123456789abcdef") %>
    # Suffix per worktree (bin/_lib.sh: kosong di checkout utama, `_<id>` di worktree) supaya
    # login di satu worktree tidak menimpa cookie worktree lain di localhost yang sama.
    cookie_name: agentgate_session<%= get_env(name="SESSION_COOKIE_SUFFIX", default="") %>
    # Idle timeout 1 hari, bergulir setiap sesi dipakai. Umur mutlak ada di settings.auth.
    ttl: 86400

  # Login Google/GitHub (services::auth::oauth). Tanpa provider: tes yang membutuhkannya
  # menambahkan provider yang menunjuk provider palsu (tests/support/fake_oauth.rs), sehingga
  # GOOGLE_CLIENT_ID/GITHUB_CLIENT_ID di shell developer tidak memengaruhi tes.
  oauth:
    base_url: http://localhost:<%= get_env(name="PORT") %>

# Storage tes: driver in-memory dipasang App::after_context (Loco tidak punya kind memori).
storage:
  kind: "Null"

settings:
  app_name: Agent Gate
  # Basis link di email; dev/test dilayani di localhost:PORT.
  public_base_url: http://localhost:<%= get_env(name="PORT") %>
  # Domain terpisah untuk pratinjau mockup HTML (iframe sandbox, tanpa cookie aplikasi).
  # Host-nya harus berbeda dari public_base_url.
  preview_base_url: http://preview.localhost:<%= get_env(name="PORT") %>
  # Pengirim semua email aplikasi (header From).
  mail_from: "Agent Gate <noreply@agentgate.test>"
  auth:
    # Parameter argon2 minimal: suite tes membuat banyak user berpassword. Tes kontrak config
    # memastikan staging/production tidak memakai angka ini.
    argon2_memory_kib: 8
    argon2_iterations: 1
    argon2_parallelism: 1
    # Cukup untuk tes yang berjalan satu thread.
    max_concurrent_hashes: 2
    # Request yang menunggu izin hash lebih lama dari ini dijawab 503, bukan antre tanpa batas.
    hash_wait_seconds: 5
    # Umur mutlak sesi (30 hari) sejak login; Loco hanya punya idle timeout (auth.session.ttl).
    absolute_lifetime_hours: 720
    # Rate limit login: 5 gagal per email atau 20 gagal per IP dalam 15 menit mengunci 15 menit.
    # Per IP lebih longgar karena satu NAT kantor bisa berisi banyak user.
    login_max_failures_per_email: 5
    login_max_failures_per_ip: 20
    login_window_minutes: 15
    login_lockout_minutes: 15
    # Umur token email: reset pendek (30 menit) karena setara password; verifikasi 24 jam dan
    # undangan 7 hari karena penerima belum tentu langsung membuka email.
    reset_token_minutes: 30
    verification_token_hours: 24
    invitation_days: 7
    # Pendaftaran publik terbuka (spec: siapa pun bisa daftar dan membuat workspace).
    registration_open: true
    # Kunci XChaCha20-Poly1305 (base64, 32 byte) untuk secret TOTP di database. Default di
    # bawah KHUSUS test, bukan rahasia; staging/production dari env tanpa default.
    # Boot gagal bila nilainya bukan base64 dari tepat 32 byte.
    encryption_key: <%= get_env(name="ENCRYPTION_KEY", default="YWdlbnRnYXRlLXRlc3Qtb25seS1ub3Qtc2VjcmV0ISE=") %>
  # API publik + webhook keluar (M11). Development/test mengizinkan tujuan webhook http ke
  # loopback (server palsu lokal); production/staging memakai default (ditolak, cegah SSRF).
  api:
    rate_limit_per_minute: 600
    webhook_timeout_seconds: 5
    webhook_allow_loopback: true
  # Connector Jira (M11): http ke loopback diizinkan untuk Jira palsu lokal; timeout pendek
  # supaya tes yang salah arah gagal cepat. Production memakai default (https publik saja).
  jira:
    timeout_seconds: 5
    allow_loopback: true
