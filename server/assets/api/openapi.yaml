openapi: 3.0.3
info:
  title: Agent Gate API
  version: "1.0"
  description: |
    REST API JSON untuk integrasi pihak ketiga. Autentikasi dengan token API pribadi
    (`Authorization: Bearer ag_pat_…`) yang dibuat di Pengaturan → API & webhook. Token
    bertindak sebagai pembuatnya (izin role dan akses project tetap berlaku) dan dibatasi
    cakupan serta project token. Batas 600 request per menit per token; sisa batas ada di
    header `X-RateLimit-Remaining`. Error selalu `{"error": "<kode>"}`.
servers:
  - url: /api/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Token API `ag_pat_…`.
  parameters:
    code:
      name: code
      in: path
      required: true
      schema: { type: string, example: KSR-24 }
    project:
      name: project
      in: query
      required: true
      schema: { type: string, example: KSR }
  headers:
    X-RateLimit-Remaining:
      schema: { type: integer }
      description: Sisa request di menit ini.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: not_found }
        field: { type: string, description: Field yang ditolak (validasi). }
    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: KSR-24 }
        title: { type: string }
        project: { type: string, example: KSR }
        status: { type: string, enum: [backlog, todo, in_progress, done] }
        priority: { type: string, enum: [urgent, high, medium, low] }
        stage: { type: string, example: review }
        story_points: { type: integer, nullable: true }
        labels: { type: array, items: { type: string } }
        assignee_id: { type: string, format: uuid, nullable: true }
        updated_at: { type: string, format: date-time }
        type: { type: string, example: task }
        description: { type: string }
        parent: { type: string, nullable: true }
        due_on: { type: string, format: date, nullable: true }
    TicketInput:
      type: object
      properties:
        project: { type: string, description: Kunci project (wajib saat membuat). }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        priority: { type: string }
        labels: { type: array, items: { type: string } }
        due_on: { type: string, format: date }
        story_points: { type: integer }
        type: { type: string, description: Kunci tipe tiket (task, bug, story, …). }
        parent: { type: string, description: Kode tiket induk. }
        stage: { type: string, description: Stage awal (hanya saat membuat). }
    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        author: { type: string, nullable: true }
        body: { type: string }
        created_at: { type: string, format: date-time }
    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        events:
          type: array
          items:
            type: string
            enum: [ticket.created, ticket.updated, ticket.stage_changed, ticket.deleted,
              comment.created, sprint.started, sprint.completed, release.published,
              gate.rejected, job.failed]
        project_ids: { type: array, items: { type: string, format: uuid } }
        active: { type: boolean }
        secret: { type: string, description: Hanya di respons pembuatan (ditampilkan sekali). }
  responses:
    Error:
      description: Error (401 invalid_token, 403 insufficient_scope, 404 not_found, 422 validasi, 429 rate_limited)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  /openapi.yaml:
    get:
      summary: Dokumen OpenAPI ini (tanpa autentikasi).
      security: []
      responses:
        "200": { description: YAML }
  /projects:
    get:
      summary: Project yang bisa diakses token.
      responses:
        "200":
          description: OK
          headers: { X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }
        default: { $ref: "#/components/responses/Error" }
  /tickets:
    get:
      summary: Daftar tiket (cakupan tiket:baca).
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: stage, in: query, schema: { type: string }, description: Kunci stage, dipisah koma. }
        - { name: status, in: query, schema: { type: string }, description: Status, dipisah koma. }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string }, description: Nilai next_cursor halaman sebelumnya. }
      responses:
        "200":
          description: "`{tickets: [Ticket], total, next_cursor}`"
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Buat tiket (cakupan tiket:tulis).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "201": { description: "`{ticket: Ticket}`" }
        default: { $ref: "#/components/responses/Error" }
  /tickets/{code}:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      summary: Satu tiket (cakupan tiket:baca).
      responses:
        "200": { description: "`{ticket: Ticket}`" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      summary: Ubah sebagian field tiket (cakupan tiket:tulis). Field yang tidak dikirim tetap.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "200": { description: "`{ticket: Ticket}`" }
        default: { $ref: "#/components/responses/Error" }
  /tickets/{code}/transition:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      summary: Pindah stage (cakupan tiket:tulis). Gate ditegakkan sama seperti di web.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties: { to: { type: string, description: Kunci stage tujuan. } }
      responses:
        "200": { description: "`{ticket: Ticket}`" }
        "422": { description: "Gate belum terpenuhi (`ticket-gates-unmet`), butuh approval, dll." }
        default: { $ref: "#/components/responses/Error" }
  /tickets/{code}/comments:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      summary: Komentar tiket (cakupan tiket:baca).
      responses:
        "200": { description: "`{comments: [Comment]}`" }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Tulis komentar (cakupan komentar:tulis).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string } }
      responses:
        "201": { description: "`{comment: Comment}`" }
        default: { $ref: "#/components/responses/Error" }
  /sprints:
    get:
      summary: Sprint project (cakupan laporan:baca).
      parameters: [{ $ref: "#/components/parameters/project" }]
      responses:
        "200": { description: "`{sprints: [...]}`" }
        default: { $ref: "#/components/responses/Error" }
  /knowledge:
    get:
      summary: Dokumen knowledge yang berlaku untuk project, tanpa isi (cakupan knowledge:baca).
      parameters: [{ $ref: "#/components/parameters/project" }]
      responses:
        "200": { description: "`{documents: [...]}`" }
        default: { $ref: "#/components/responses/Error" }
  /knowledge/{slug}:
    get:
      summary: Satu dokumen knowledge beserta isi Markdown (cakupan knowledge:baca).
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/project" }
      responses:
        "200": { description: "`{document: {..., body}}`" }
        default: { $ref: "#/components/responses/Error" }
  /webhooks:
    get:
      summary: Webhook workspace (cakupan webhook:kelola, pembuat token mengatur integrasi).
      responses:
        "200": { description: "`{webhooks: [Webhook]}`" }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Buat webhook (URL https). Secret ditampilkan sekali di respons.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string }
                events: { type: array, items: { type: string } }
                projects: { type: array, items: { type: string }, description: Kunci project; kosong = semua. }
      responses:
        "201": { description: "`{webhook: Webhook}`" }
        default: { $ref: "#/components/responses/Error" }
  /webhooks/{id}:
    delete:
      summary: Hapus webhook.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Dihapus }
        default: { $ref: "#/components/responses/Error" }
x-webhooks:
  description: |
    Setiap pengiriman adalah POST JSON `{id, event, created_at, workspace, project, data}` dengan
    header `X-AgentGate-Event`, `X-AgentGate-Delivery`, `X-AgentGate-Timestamp`, dan
    `X-AgentGate-Signature: sha256=<hex HMAC-SHA256(secret, "{timestamp}.{body}")>`. Respons 2xx
    dianggap berhasil; gagal diulang hingga 5 kali dengan jeda bertahap (1, 5, 30, 120 menit).
