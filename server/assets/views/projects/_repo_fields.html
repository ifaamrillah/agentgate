{#- Field satu form repo (tambah atau ubah). Variabel: repo (views::projects::RepoFormView:
    field_id (awalan id input), name, provider, url, default_branch, errors), providers
    ([{value, label_key}]). -#}
<div class="app-form-row">
  {{ <field id={repo.field_id ~ "-name"} name="name" label={t(key="repo-name", lang="id")} value={repo.name} error={repo.errors.name.code} error_min={repo.errors.name.min} error_max={repo.errors.name.max} required={true} mono={true}/> }}
  {{ <select_field id={repo.field_id ~ "-provider"} name="provider" label={t(key="repo-provider", lang="id")} options={providers} option_value="value" option_label="label_key" translate={true} value={repo.provider} error={repo.errors.provider.code}/> }}
</div>
<div class="app-form-row">
  {{ <field id={repo.field_id ~ "-url"} name="url" label={t(key="repo-url", lang="id")} value={repo.url} error={repo.errors.url.code} error_max={repo.errors.url.max} autocomplete="off" required={true} mono={true}/> }}
  {{ <field id={repo.field_id ~ "-branch"} name="default_branch" label={t(key="repo-default-branch", lang="id")} value={repo.default_branch} error={repo.errors.default_branch.code} error_max={repo.errors.default_branch.max} autocomplete="off" required={true} mono={true}/> }}
</div>
