[package]
name = "agentgate-cli"
description = "CLI agentgate: installer aturan, indexer, dan runner job"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentgate"
path = "src/main.rs"

[dependencies]
# Type dan versi bersama dengan server.
agentgate-core = { path = "../core" }
# Parsing argumen CLI.
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
# Tes integrasi memeriksa versi yang dilaporkan sama dengan crate core.
agentgate-core = { path = "../core" }
