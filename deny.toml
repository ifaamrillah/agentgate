# cargo deny check: advisory keamanan, lisensi, crate duplikat, dan crate terlarang.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Crate workspace sendiri tidak dipublikasikan.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # TLS lewat rustls; openssl butuh toolchain C dan beda perilaku antar-OS.
  { crate = "openssl-sys", reason = "pakai rustls" },
  # SQLite tidak dipakai di environment mana pun (rules §1).
  { crate = "libsqlite3-sys", reason = "Postgres saja" },
  # Redis tidak dipakai (queue dan realtime lewat Postgres).
  { crate = "redis", reason = "tanpa Redis" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
