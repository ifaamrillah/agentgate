name: ci

on:
  push:
    branches: [staging, release]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pemeriksaan lengkap di Docker, persis seperti di laptop developer.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: bin/ci
        run: bin/ci

  # CLI agentgate harus build dan lulus tes di ketiga OS target (runner jalan di laptop user).
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain dari rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Test CLI dan core
        run: cargo test --locked -p agentgate-cli -p agentgate-core
