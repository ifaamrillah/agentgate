# Container toolchain satu checkout/worktree. Project name di-set bin/_lib.sh:
# agentgate-rs (sama dengan layanan bersama) untuk checkout utama, agentgate-rs-<id> untuk worktree.
services:
  app:
    build:
      context: ./dev
      args:
        UID: ${AG_UID:-1000}
        GID: ${AG_GID:-1000}
    image: agentgate-rs-dev:${AG_IMAGE_TAG:-latest}
    init: true
    labels:
      agentgate.port: "${AG_PORT:-5150}"
    environment:
      AG_ID: ${AG_ID:-}
      # Jumlah job cargo (default image: 8). Mesin dengan RAM lega boleh menaikkannya.
      CARGO_BUILD_JOBS: ${AG_CARGO_JOBS:-8}
    ports:
      - "127.0.0.1:${AG_PORT:-5150}:${AG_PORT:-5150}"
    volumes:
      - ${AG_ROOT}:/workspace
      - target:/workspace/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - dev-cache:/home/dev/.cache
    networks: [agentgate-rs]

# Semua volume external (dibuat bin/_lib.sh), supaya `down --volumes` tidak menghapus apa pun.
# Volume target milik worktree dihapus eksplisit oleh bin/worktree saat worktree ditutup.
volumes:
  target:
    name: agentgate-rs-target-${AG_ID_OR_MAIN:-main}
    external: true
  # Dibagi semua checkout.
  cargo-registry:
    name: agentgate-rs-cargo-registry
    external: true
  cargo-git:
    name: agentgate-rs-cargo-git
    external: true
  dev-cache:
    name: agentgate-rs-dev-cache
    external: true

networks:
  agentgate-rs:
    name: agentgate-rs
    external: true
