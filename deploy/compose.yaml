# Deploy Agent Gate di satu VPS dengan Docker Compose (M12). Project: agentgate-rs-prod.
#   cp deploy/.env.example deploy/.env   # isi semua nilai
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d
# Panduan lengkap: docs/admin/deploy.md. Aritmetika koneksi pool: deploy/README.md.
name: agentgate-rs-prod

x-app: &app
  image: ${AGENTGATE_IMAGE:-agentgate-rs-server:latest}
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    LOCO_ENV: production
    PORT: "5150"
    DATABASE_URL: postgres://agentgate:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD}@db:5432/agentgate
    S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
  networks: [internal]
  # Clone repo code graph + model embedding (R2). Bersama web & worker.
  volumes:
    - cache:/var/cache/agentgate
  depends_on:
    db: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
    s3-init: { condition: service_completed_successfully }

services:
  # Migrasi sekali jalan sebelum web/worker (auto_migrate mati di production). statement_timeout
  # dimatikan khusus koneksi ini: membuat index di tabel besar boleh lebih dari 30 dtk.
  migrate:
    <<: *app
    restart: "no"
    command: ["db", "migrate"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://agentgate:${POSTGRES_PASSWORD}@db:5432/agentgate?options=-c%20statement_timeout%3D0
    depends_on:
      db: { condition: service_healthy }

  web:
    <<: *app
    command: ["start", "--no-banner"]
    deploy:
      replicas: ${WEB_REPLICAS:-1}

  # Worker job + scheduler di satu proses. Scheduler harus tepat satu: bila worker diskalakan,
  # pisahkan scheduler ke service sendiri (`start --scheduler`) dengan replicas 1.
  worker:
    <<: *app
    command: ["start", "--worker", "--scheduler", "--no-banner"]
    healthcheck:
      disable: true

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agentgate
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-100}", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-512MB}"]
    volumes:
      - pg-data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgate -d agentgate"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  # Storage S3-compatible di VPS yang sama. Boleh diganti S3 eksternal: isi S3_ENDPOINT (kosong =
  # AWS) dan hapus service s3/s3-init.
  s3:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"agentgate","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?isi S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?isi S3_SECRET_ACCESS_KEY}
    volumes:
      - s3-data:/data
    networks: [internal]

  # Buat bucket sekali (idempoten).
  s3-init:
    build: ./backup
    image: agentgate-rs-backup:latest
    restart: "no"
    env_file: .env
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
    command: ["init-bucket"]
    depends_on: [s3]
    networks: [internal]

  # Backup harian: pg_dump + salinan bucket file ke storage di LUAR VPS (BACKUP_REMOTE_*), riwayat
  # di tabel system_backups (halaman Status sistem). Manual: `docker compose ... exec backup
  # backup.sh now`; pulihkan: docs/admin/backup.md.
  backup:
    build: ./backup
    image: agentgate-rs-backup:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://agentgate:${POSTGRES_PASSWORD}@db:5432/agentgate
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
    command: ["loop"]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?isi APP_DOMAIN}
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:?isi PREVIEW_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    networks: [internal]

volumes:
  cache:
    name: agentgate-rs-prod-cache
  pg-data:
    name: agentgate-rs-prod-pg-data
  s3-data:
    name: agentgate-rs-prod-s3-data
  caddy-data:
    name: agentgate-rs-prod-caddy-data
  caddy-config:
    name: agentgate-rs-prod-caddy-config

networks:
  internal:
    name: agentgate-rs-prod
